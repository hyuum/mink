# Builds the Android app (the same planner, plus phone tracking) and puts the install file on the
# "android-latest" release, so the newest version is always at the same link.
name: Android app

on:
  push:
    branches: [main, claude/chatlog-access-summary-z9a6dl]
    paths: [src/**, public/**, android/**, tests/**, package.json, package-lock.json, capacitor.config.json, build.mjs, .github/workflows/android.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install
        run: npm ci

      - name: Check
        run: npm run typecheck && npm test

      - name: Build the web app and copy it into Android
        run: npm run build && npx cap sync android

      - name: Unlock the signing key
        env:
          PASSPHRASE: ${{ secrets.ANDROID_KEY_PASSPHRASE }}
        run: |
          if [ -z "$PASSPHRASE" ]; then
            echo "::error::Add the ANDROID_KEY_PASSPHRASE secret (Settings › Secrets and variables › Actions) so builds are signed with the private key."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/app/release.jks.enc -out "$RUNNER_TEMP/release.jks" -pass env:PASSPHRASE

      - name: Build the APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEY_PASSPHRASE }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Publish to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk matcha-planner.apk
          notes="Install file for Matcha Planner on Android. Built from ${GITHUB_SHA::7} (build ${{ github.run_number }}). Download matcha-planner.apk on your phone and open it."
          # GitHub's release API sometimes answers 500; try each call a few times before giving up.
          retry() { for i in 1 2 3 4; do "$@" && return 0; echo "Retrying in $((i * 5))s…"; sleep $((i * 5)); done; return 1; }
          if gh release view android-latest >/dev/null 2>&1; then
            retry gh release edit android-latest --notes "$notes" || echo "::warning::Couldn't update the release notes; uploading anyway."
          else
            retry gh release create android-latest --title "Matcha Planner for Android" --notes "$notes" --target "$GITHUB_SHA"
          fi
          retry gh release upload android-latest matcha-planner.apk --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: matcha-planner-apk
          path: matcha-planner.apk
